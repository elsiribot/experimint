[package]
authors = { workspace = true }
description = "fedimint-amm-client contains the client side of the AMM module"
edition = { workspace = true }
license = { workspace = true }
name = "fedimint-amm-client"
repository = { workspace = true }
version = { workspace = true }

[features]
# `ClientModule::handle_cli_command`, i.e. `fedimint-cli module amm <verb>`.
# Off by default so a wallet embedding this module never links clap.
cli = ["dep:clap"]
default = []

[lib]
name = "fedimint_amm_client"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bitcoin_hashes = { workspace = true }
clap = { workspace = true, optional = true }
erased-serde = { workspace = true }
fedimint-amm-common = { workspace = true }
fedimint-api-client = { workspace = true }
fedimint-client-module = { workspace = true }
fedimint-core = { workspace = true }
fedimint-derive-secret = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
# Not gated behind `cli`: `handle_cli_command` returns `serde_json::Value` from
# the `ClientModule` trait, and `swap.rs`'s tests use it too, so an optional
# dependency would only buy `#[cfg]` noise over a crate already in the tree via
# `fedimint-core`.
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
