[package]
authors = { workspace = true }
description = "fedimint-cli built with the experimint client module set (v2 core modules + meta + amm + usdt)"
edition = { workspace = true }
license = { workspace = true }
name = "fedimint-cli-experimint"
publish = false
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[[bin]]
name = "fedimint-cli-experimint"
path = "src/bin/main.rs"

[lib]
name = "fedimint_cli_experimint"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
fedimint-amm-client = { workspace = true, features = ["cli"] }
# `info` reads the `amm` unit allowlist out of its own client config rather than
# keeping a kind -> unit table; the `-common` crate is where that type lives.
fedimint-amm-common = { workspace = true }
fedimint-bip39 = { workspace = true }
# Defaults are off at the workspace level (see the root manifest). `tor` is
# re-enabled here: it is what lets an invite code name an onion API endpoint.
# `jemalloc` is deliberately not: that feature only pulls `tikv-jemallocator`
# in, while the `#[global_allocator]` that makes it take effect lives in the
# binary crate root and would have to be vendored here. Upstream wants it
# because rocksdb fragments the system allocator over a long-lived process;
# this CLI runs one command and exits.
fedimint-cli = { workspace = true, features = ["tor"] }
fedimint-client = { workspace = true }
fedimint-client-module = { workspace = true }
fedimint-connectors = { workspace = true }
fedimint-core = { workspace = true }
fedimint-lnv2-client = { workspace = true, features = ["cli"] }
# `info` initializes tracing itself on the path where it never reaches
# `FedimintCli::new`, which is what otherwise does it.
fedimint-logging = { workspace = true }
fedimint-meta-client = { workspace = true, features = ["cli"] }
fedimint-mintv2-client = { workspace = true, features = ["cli"] }
# The client database backend upstream defaults to. `info` opens the same
# `<data-dir>/client.db` upstream's own subcommands do, since a data dir has to
# stay usable by both halves of this binary.
fedimint-rocksdb = { workspace = true }
fedimint-usdt-client = { workspace = true, features = ["cli"] }
# `USDT_UNIT`: the unit the usdt module's own consensus logic credits, and the
# only place that association is published.
fedimint-usdt-common = { workspace = true }
fedimint-walletv2-client = { workspace = true, features = ["cli"] }
serde = { workspace = true }
serde_json = { workspace = true }
stability-pool-client = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# `client_and_server_module_sets_agree` compares this crate's client module set
# against the server set that binary registers, rather than a second
# hand-written list that could drift from it.
fedimintd-experimint = { path = "../fedimintd-experimint" }

[build-dependencies]
# Sets `FEDIMINT_BUILD_CODE_VERSION`, which `fedimint_build_code_version_env!()`
# reads via `env!` at *this* crate's compile time. Without the build script the
# macro fails to expand.
fedimint-build = { workspace = true }

[lints]
workspace = true
