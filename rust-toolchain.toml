# Matches fedimint master's flakebox setting `toolchain.channel = "stable"`
# (fedimint has no `rust-toolchain.toml` of its own; the channel is configured
# in its `flake.nix`). The workspace uses edition 2024, so this needs >= 1.85.
[toolchain]
channel = "stable"
components = ["rustc", "cargo", "clippy", "rustfmt", "rust-src", "rust-analyzer"]
