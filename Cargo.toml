[workspace]
members = [
    "bin/amm-price-keeper",
    "bin/fedimint-cli-experimint",
    "bin/fedimintd-experimint",
    "crypto/threshold-ecdsa",
    "modules/amm/fedimint-amm-client",
    "modules/amm/fedimint-amm-common",
    "modules/amm/fedimint-amm-server",
    "modules/amm/fedimint-amm-tests",
    "modules/usdt/fedimint-usdt-client",
    "modules/usdt/fedimint-usdt-common",
    "modules/usdt/fedimint-usdt-server",
    "modules/usdt/fedimint-usdt-tests",
]
resolver = "2"

[workspace.package]
authors = ["The Experimint Developers"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/elsirion/experimint"
version = "0.1.0"

[workspace.dependencies]
# --- fedimint (pinned to the experimint platform branch) ---------------------
#
# All fedimint crates MUST share the exact same `rev`, otherwise cargo resolves
# them as distinct source packages and the trait impls stop lining up. That
# applies across module families too: `amm` and `usdt` must see one and the
# same `fedimint-core`, or they can never be registered into one federation.
#
# rev af716441eea22ebd15251e4eaea392dc1f3d70c4 == elsiribot/fedimint
# `experimint-v0.11` ("chore: drop fedimint-threshold-ecdsa; it lives in
# experimint now"), workspace version 0.12.0-alpha.
#
# Why the fork and not upstream master: the branch carries the `--module`
# config-gen CLI and the typed per-module `ServerModuleInit::Params` hook.
# (`fedimint-threshold-ecdsa` used to be a reason too, but it lives in this
# repo now, at `crypto/threshold-ecdsa`, next to its only consumer.) It is NOT
# a descendant of upstream master — the two diverged from `be854220f`, so this
# is a different API generation (0.12.0-alpha), not a newer one.
#
# To bump: move this rev, then re-run `cargo check --workspace --all-targets`.
# `branch = "experimint-v0.11"` would also resolve but is not reproducible.
devimint = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-aead = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-api-client = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-bip39 = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-build = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
# The one entry here that is not a bare `{ git, rev }`. `default-features` has
# to be pinned at the workspace level for a member to be allowed to narrow it
# at all: cargo rejects `default-features = false` on an inherited dependency
# whose workspace entry left it at the default. `bin/fedimint-cli-experimint`
# re-enables `tor` and explains why it leaves `jemalloc` off.
fedimint-cli = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4", default-features = false }
fedimint-client = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-client-module = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-connectors = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-core = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-derive-secret = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-dummy-client = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-dummy-server = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-eventlog = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-lnv2-client = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-lnv2-common = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-lnv2-server = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-logging = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-meta-client = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-meta-common = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-meta-server = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-mint-client = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-mint-common = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-mint-server = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-mintv2-client = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-mintv2-common = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-mintv2-server = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-rocksdb = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-server ={ git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-server-core = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-testing = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-walletv2-client = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-walletv2-common = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimint-walletv2-server = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
fedimintd = { git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }
# `hkdf` is what `crypto/threshold-ecdsa` calls the crate; the package is
# fedimint's own `fedimint-hkdf`, so it lives in this pinned block.
hkdf = { package = "fedimint-hkdf", git = "https://github.com/elsiribot/fedimint", rev = "af716441eea22ebd15251e4eaea392dc1f3d70c4" }

# NOTE: fedimint's own `Cargo.lock` is NOT inherited when you depend on it as a
# git dependency — cargo re-resolves the whole tree from scratch. That can land
# on version combinations fedimint itself never builds. Concretely: a fresh
# resolve picks `bdk_electrum 0.23.2`, which pulls `electrum-client 0.24.1`,
# while `fedimint-ldk-node 0.6.1` also depends on `electrum-client 0.23.1`
# directly. Two semver-incompatible copies end up in the graph and
# `fedimint-ldk-node` fails to compile ("`electrum_client::Client: Deref` is not
# satisfied"). Our `Cargo.lock` pins `bdk_electrum` back to 0.23.0, matching
# fedimint's lock. If you ever `cargo update` this back into the ditch:
#
#     cargo update -p bdk_electrum --precise 0.23.0
#
# This only affects `fedimint-amm-tests` (the only crate pulling
# `fedimint-testing` -> gateway -> ldk-node). Keep `Cargo.lock` committed.

# --- in-workspace ------------------------------------------------------------
# `bin/amm-price-keeper` builds its client from the same module registry the CLI
# does (`experimint_modules`), so the two binaries can never disagree about
# which kinds a data dir is readable with. That registry is the crate's only
# export, and it is a `[lib]` for exactly this reason.
fedimint-cli-experimint = { path = "bin/fedimint-cli-experimint", version = "0.1.0" }
fedimint-threshold-ecdsa = { path = "crypto/threshold-ecdsa", version = "0.1.0" }
fedimint-amm-client = { path = "modules/amm/fedimint-amm-client", version = "0.1.0" }
fedimint-amm-common = { path = "modules/amm/fedimint-amm-common", version = "0.1.0" }
fedimint-amm-server = { path = "modules/amm/fedimint-amm-server", version = "0.1.0" }
fedimint-usdt-client = { path = "modules/usdt/fedimint-usdt-client", version = "0.1.0" }
fedimint-usdt-common = { path = "modules/usdt/fedimint-usdt-common", version = "0.1.0" }
fedimint-usdt-server = { path = "modules/usdt/fedimint-usdt-server", version = "0.1.0" }

# --- fedi (pinned to the experimint branch of elsiribot/fedi) ----------------
#
# rev db07c5e35caba3d40e8f321be95ca0a46468bea9 == elsiribot/fedi `experimint`: fedi master (cb458841e, spv2
# as deployed) with the fedimint deps switched to the platform branch above
# and stability-pool-{common,server,client} ported to its module API. The
# fedimint URL+rev on that branch are byte-identical to this workspace's —
# that is what keeps cargo resolving one fedimint-core, not two.
stability-pool-client = { git = "https://github.com/elsiribot/fedi", rev = "db07c5e35caba3d40e8f321be95ca0a46468bea9" }
stability-pool-common = { git = "https://github.com/elsiribot/fedi", rev = "db07c5e35caba3d40e8f321be95ca0a46468bea9" }
stability-pool-server = { git = "https://github.com/elsiribot/fedi", rev = "db07c5e35caba3d40e8f321be95ca0a46468bea9" }

# --- third party -------------------------------------------------------------
# Versions are copied verbatim from the pinned platform branch's
# `[workspace.dependencies]` so we share resolved versions with it rather than
# pulling in a second copy. Do not "upgrade" one of these in isolation — an
# exact match is what keeps `alloy*`/`secp256k1`/`bls12_381`/`cggmp21` from
# unifying into two semver-incompatible copies across the git boundary.
alloy = { version = "2.1", default-features = false, features = [
    "essentials",
    "reqwest-rustls-tls",
] }
alloy-consensus = "2.1"
alloy-primitives = { version = "1.6", default-features = false, features = [
    "std",
] }
alloy-rlp = "0.3"
alloy-sol-types = { version = "1.6", default-features = false, features = [
    "std",
] }
alloy-trie = "0.9"
anyhow = "1.0.98"
async-stream = "0.3.6"
async-trait = "0.1.88"
bitcoin = { version = "0.32.6", features = ["serde"] }
bitcoin_hashes = "0.14.0"
bincode = "1.3.3"
bls12_381 = "0.8.0"
cggmp21 = { version = "0.6.3", features = [
    "hd-wallet",
    "hd-slip10",
    "curve-secp256k1",
    "state-machine",
] }
clap = { version = "4.5.60", features = ["derive", "env"] }
erased-serde = "0.4"
futures = "0.3.32"
hd-wallet = { version = "0.6.1", default-features = false, features = [
    "slip10",
    "curve-secp256k1",
] }
hex = "0.4.3"
hex_lit = "0.1.1"
rand = "0.8.5"
ring = "0.17.14"
round-based = { version = "0.4", features = ["derive"] }
# No "stream": reqwest 0.12's stream feature pulls wasm-streams 0.4, and any
# consumer that also has a reqwest 0.13 in its graph (alloy, matrix-sdk, iroh 1)
# gets wasm-streams 0.5 too. Both generate the same wasm-bindgen shims, so a
# wasm32 link fails with duplicate symbol: intounderlyingsink_*. Nothing here
# streams a response body -- every transport in this workspace is JSON-RPC.
reqwest = { version = "0.12.28", features = [
    "json",
    "rustls-tls",
    "charset",
    "http2",
], default-features = false }
secp256k1 = { version = "0.29.0", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde-big-array = "0.5.1"
serde_json = "1.0.149"
sha2 = "0.10"
sha3 = "0.10.8"
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
thiserror = "2.0.18"
tokio = "1.48.0"
tokio-stream = "0.1.18"
tracing = "0.1.44"
url = "2.5.4"

[workspace.lints.clippy]
dbg_macro = "deny"
# Mirrors the platform branch's lint policy, so module source lifted from it
# stays lint-clean here.
literal_string_with_formatting_args = "deny"

[profile.dev]
debug = "line-tables-only"

# Mirrors fedimint: crypto/serialization crates are unusably slow in a debug
# build otherwise.
[profile.dev.package]
bitcoin_hashes = { opt-level = 3 }
bls12_381 = { opt-level = 3 }
# cggmp21 threshold-ECDSA ecosystem, copied from the platform branch: the
# Paillier/bignum/curve math is extremely heavy at opt-level 1, which makes the
# usdt module's runtime MPC signing tests take many minutes in dev.
cggmp21 = { opt-level = 3 }
cggmp21-keygen = { opt-level = 3 }
fedimint-threshold-crypto = { opt-level = 3 }
ff = { opt-level = 3 }
generic-ec = { opt-level = 3 }
generic-ec-core = { opt-level = 3 }
generic-ec-curves = { opt-level = 3 }
generic-ec-zkp = { opt-level = 3 }
gmp-mpfr-sys = { opt-level = 3 }
group = { opt-level = 3 }
hd-wallet = { opt-level = 3 }
librocksdb-sys = { opt-level = 3 }
paillier-zk = { opt-level = 3 }
pairing = { opt-level = 3 }
rand = { opt-level = 3 }
rand_chacha = { opt-level = 3 }
rand_core = { opt-level = 3 }
ring = { opt-level = 3 }
rug = { opt-level = 3 }
secp256k1 = { opt-level = 3 }
secp256k1-sys = { opt-level = 3 }
subtle = { opt-level = 3 }
zeroize = { opt-level = 3 }

